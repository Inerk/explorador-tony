name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
      - name: Renombrar APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk Explorador-Tony-v1.0.${{ github.run_number }}.apk
          cp app/build/outputs/apk/release/app-release.apk Explorador-Tony.apk
      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Explorador Tony v1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: |
            Explorador-Tony-v1.0.${{ github.run_number }}.apk
            Explorador-Tony.apk
